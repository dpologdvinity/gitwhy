version: 2
project_name: gitwhy
builds:
  - main: ./cmd/gitwhy
    binary: gitwhy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: gitwhy
    binaries: [gitwhy]
    homepage: https://github.com/dpologdvinity/gitwhy
    description: "Do anything with git without looking it up, with previews and undo"
    license: MIT
    repository:
      owner: dpologdvinity
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
changelog:
  use: github
