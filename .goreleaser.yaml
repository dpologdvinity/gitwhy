version: 2
project_name: gitwhy
builds:
  - main: ./cmd/gitwhy
    binary: gitwhy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
    format_overrides:
      - goos: windows
        formats: [zip]
nfpms:
  - id: gitwhy
    package_name: gitwhy
    maintainer: Kaitlyn Bassford <dpologdvinity@users.noreply.github.com>
    homepage: https://github.com/dpologdvinity/gitwhy
    description: Do anything with git without looking it up, with previews and undo
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    dependencies: [git]
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gitwhy/LICENSE
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: gitwhy
    binaries: [gitwhy]
    homepage: https://github.com/dpologdvinity/gitwhy
    description: "Do anything with git without looking it up, with previews and undo"
    license: MIT
    repository:
      owner: dpologdvinity
      name: homebrew-gitwhy
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
scoops:
  - repository:
      owner: dpologdvinity
      name: homebrew-gitwhy # one repo for the Homebrew cask and the Scoop bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: bucket
    homepage: https://github.com/dpologdvinity/gitwhy
    description: Do anything with git without looking it up, with previews and undo
    license: MIT
changelog:
  use: github
