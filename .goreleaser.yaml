version: 2
project_name: gitwhy
builds:
  - main: ./cmd/gitwhy
    binary: gitwhy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
    format_overrides:
      - goos: windows
        formats: [zip]
nfpms:
  - id: gitwhy
    package_name: gitwhy
    maintainer: Kaitlyn Bassford <dpologdvinity@users.noreply.github.com>
    homepage: https://github.com/dpologdvinity/gitwhy
    description: Do anything with git without looking it up, with previews and undo
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    dependencies: [git]
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gitwhy/LICENSE
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: gitwhy
    binaries: [gitwhy]
    homepage: https://github.com/dpologdvinity/gitwhy
    description: "Do anything with git without looking it up, with previews and undo"
    license: MIT
    repository:
      owner: dpologdvinity
      name: homebrew-gitwhy
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
scoops:
  - repository:
      owner: dpologdvinity
      name: homebrew-gitwhy # one repo for the Homebrew cask and the Scoop bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: bucket
    homepage: https://github.com/dpologdvinity/gitwhy
    description: Do anything with git without looking it up, with previews and undo
    license: MIT
winget:
  - name: gitwhy
    package_identifier: dpologdvinity.gitwhy
    publisher: dpologdvinity
    publisher_url: https://github.com/dpologdvinity
    short_description: Do anything with git without looking it up, with previews and undo
    license: MIT
    homepage: https://github.com/dpologdvinity/gitwhy
    # Without a token (no fork yet) skip the upload instead of failing the release.
    skip_upload: '{{ if index .Env "WINGET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: dpologdvinity
      name: winget-pkgs
      branch: "gitwhy-{{ .Version }}"
      token: '{{ index .Env "WINGET_TOKEN" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
aurs:
  - name: gitwhy-bin
    homepage: https://github.com/dpologdvinity/gitwhy
    description: Do anything with git without looking it up, with previews and undo
    license: MIT
    maintainers:
      - Kaitlyn Bassford <dpologdvinity@users.noreply.github.com>
    depends: [git]
    git_url: ssh://aur@aur.archlinux.org/gitwhy-bin.git
    private_key: '{{ index .Env "AUR_KEY" }}'
    # Without a key (no AUR account yet) skip the upload instead of failing the release.
    skip_upload: '{{ if index .Env "AUR_KEY" }}false{{ else }}true{{ end }}'
changelog:
  use: github
