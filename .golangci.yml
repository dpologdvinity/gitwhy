# golangci-lint v2 config. CI runs "golangci-lint run ./..." on Linux and it must report
# "0 issues.". Only the default linters run; this file only tunes errcheck.
version: "2"
linters:
  settings:
    errcheck:
      # Best-effort cleanup and terminal output: failures here don't change the result.
      # git's Output returns stdout and an error; a call that drops both only wants git run,
      # best effort.
      exclude-functions:
        - os.Remove
        - os.RemoveAll
        - (*os.File).Close
        - path/filepath.WalkDir
        - charm.land/lipgloss/v2.Println
        - (github.com/dpologdvinity/gitwhy/internal/git.Runner).Output
        - (*github.com/dpologdvinity/gitwhy/internal/git.Repo).Output
  exclusions:
    rules:
      # Tests clean up temporary repositories without checking every error; a real failure
      # shows up as a failed assertion anyway.
      - path: _test\.go
        linters: [errcheck]
