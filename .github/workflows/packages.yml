name: packages
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - scripts/build-repos.sh
      - scripts/test-repos.sh
      - scripts/test-pkgs.sh
      - .github/workflows/packages.yml
jobs:
  repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Build the repos with a throwaway key and install from them (Ubuntu, Fedora)
        run: scripts/test-repos.sh dist
      - name: Install the Alpine and Arch packages (Alpine, Arch)
        run: scripts/test-pkgs.sh dist
  nix:
    runs-on: ubuntu-latest # fails when go.mod/go.sum change and flake.nix's vendorHash is stale
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default --print-build-logs
      - run: ./result/bin/gitwhy version
