# Manual health check for the repository secrets the release needs.
#
# Run it from the Actions tab ("Run workflow") before a release. It never prints a secret. It reports
# whether each secret is set, and for the two that can be tested without side effects it checks that
# the credential works and can reach what the release needs:
#   - HOMEBREW_TAP_TOKEN must be able to write to dpologdvinity/homebrew-gitwhy (the Homebrew tap)
#   - GPG_PRIVATE_KEY must import as a secret key that can sign
# NPM_TOKEN, WINGET_TOKEN and GPG_PASSPHRASE are only checked for presence.
name: check-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAP_REPO: dpologdvinity/homebrew-gitwhy
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Which secrets are set
        run: |
          failed=0
          for name in HOMEBREW_TAP_TOKEN GPG_PRIVATE_KEY NPM_TOKEN; do
            if [ -n "${!name}" ]; then echo "ok:       $name is set"; else echo "MISSING:  $name (required)"; failed=1; fi
          done
          for name in GPG_PASSPHRASE WINGET_TOKEN; do
            if [ -n "${!name}" ]; then echo "ok:       $name is set"; else echo "not set:  $name (optional)"; fi
          done
          exit "$failed"
      - name: HOMEBREW_TAP_TOKEN can write to the Homebrew tap
        run: |
          push=$(curl -fsS -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TAP_REPO" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("permissions",{}).get("push"))')
          echo "push permission on $TAP_REPO: $push"
          test "$push" = "True"
      - name: GPG_PRIVATE_KEY imports and can sign
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          test -n "$key"
          echo hello > msg
          if [ -n "$GPG_PASSPHRASE" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --local-user "$key" --clearsign msg 3<<<"$GPG_PASSPHRASE"
          else
            gpg --batch --yes --pinentry-mode loopback --local-user "$key" --clearsign msg
          fi
          test -s msg.asc
          echo "can sign with key ending ${key: -8}"
