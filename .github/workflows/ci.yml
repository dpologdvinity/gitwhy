name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git-lfs git-filter-repo
      - run: node --test npm/lib.test.js
      - run: go vet ./...
      - run: go test ./...
      - name: Remote tests with autocrlf=true (the Git for Windows default)
        if: runner.os == 'Windows'
        env:
          GITWHY_TEST_AUTOCRLF: "true"
        run: go test ./cmd/gitwhy/ -run 'TestMakeBranchMatchRemote|TestRecoverPlainGitPull|TestDeleteBranchUsesItsUpstream|TestPushedCommitWarning'
      - name: install.ps1 (PowerShell 7 and Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GITWHY_BIN_DIR = Join-Path $env:RUNNER_TEMP 'gw-pwsh7'
          ./install.ps1
          & "$env:GITWHY_BIN_DIR\gitwhy.exe" version
          $env:GITWHY_BIN_DIR = Join-Path $env:RUNNER_TEMP 'gw-ps5'
          powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed under Windows PowerShell" }
          & "$env:GITWHY_BIN_DIR\gitwhy.exe" version
      - if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
