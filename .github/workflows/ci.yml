name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git-lfs git-filter-repo
      - run: node --test npm/lib.test.js
      - run: go vet ./...
      - run: go test ./...
      - name: Remote tests with autocrlf=true (the Git for Windows default)
        if: runner.os == 'Windows'
        env:
          GITWHY_TEST_AUTOCRLF: "true"
        run: go test ./cmd/gitwhy/ -run 'TestMakeBranchMatchRemote|TestRecoverPlainGitPull|TestDeleteBranchUsesItsUpstream|TestPushedCommitWarning'
      - if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
