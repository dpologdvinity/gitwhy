title: Work on another branch in a separate folder (worktree)
aliases: [worktree, second checkout, work on two branches at once, worktree add]
category: monorepo
questions:
  - {id: target, ask: "Which branch?", type: branch, source: all}
  - {id: dir, ask: "Folder for it (e.g. ../hotfix)", type: text}
steps:
  - when: '{{not .target_track}}'
    git: [worktree, add, "{{.dir}}", "{{.target_local}}"]
  - when: '{{.target_track}}'
    git: [worktree, add, --track, -b, "{{.target_local}}", "{{.dir}}", "{{.target_track}}"]
predict: "Folder {{.dir}} gets a checkout of {{if .target_track}}a new local branch {{.target_local}}, made from {{.target_track}} and tracking it{{else}}{{.target_local}}{{end}}, sharing this repo's history. Your current folder doesn't change."
