# Switches to another branch. If you pick a remote branch such as origin/feat with no local branch
# of that name, gitwhy fills in {{.target_track}} and a local branch {{.target_local}} is made to
# track it, since switching to a remote branch directly would fail. Uncommitted changes come along.
# gitwhy undo switches back.
title: Switch to another branch
aliases: [checkout branch, change branch, go to branch, switch]
category: branches
questions:
  - {id: target, ask: "Which branch?", type: branch, source: all}
steps:
  - when: '{{not .target_track}}'
    git: [switch, "{{.target_local}}"]
  - when: '{{.target_track}}'
    git: [switch, -c, "{{.target_local}}", --track, "{{.target_track}}"]
predict: "{{if .target_track}}A new local branch {{.target_local}} is made from {{.target_track}} and tracks it. Your files change to it.{{else}}Your files change to {{.target_local}}.{{end}} Uncommitted changes come along; git stops if they'd be overwritten."
