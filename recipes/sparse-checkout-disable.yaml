# Turns sparse checkout off, so every folder comes back on disk. History doesn't change.
# Snapshots save the sparse-checkout settings, so gitwhy undo turns it back on.
title: Check out every folder again (turn off sparse checkout)
aliases: [disable sparse checkout, all folders, full checkout, sparse checkout off]
category: monorepo
questions: []
steps:
  - git: [sparse-checkout, disable]
predict: Every folder comes back on disk. Nothing in history changes.
