# Changes the message of a commit. For the last commit it amends it; "--only" with no paths keeps
# staged changes out. For an older commit it runs "rebase -i" from that commit's parent and gitwhy
# edits the todo list itself to reword it with your message, so no editor opens. The commit and
# every later one get new IDs; gitwhy undo puts the old history back.
title: Change a commit message
aliases: [rename commit, reword, edit commit message, fix commit message, rename past commit]
category: rewrite history
checks:
  - {if: no-commits, block: "There are no commits yet."}
  - {if: in-progress-op, block: "Finish or abort the current operation first.", suggest: abort-operation}
questions:
  - {id: commit, ask: "Which commit?", type: commit, source: HEAD}
  - {id: message, ask: "New message", type: text}
steps:
  - when: '{{eq .commit_pushed "true"}}'
    warn: "That commit is already on the remote. Changing its message rewrites shared history; you'll need to force-push."
  - when: '{{eq .commit .head}}'
    git: [commit, --amend, --only, -m, "{{.message}}"]
  - when: '{{ne .commit .head}}'
    git: [rebase, -i, --autostash, --rebase-merges, "{{.commit_base}}"]
    todo:
      - {action: reword, commit: "{{.commit}}", message: "{{.message}}"}
predict: The message of {{.commit}} becomes "{{.message}}". It and every later commit get new IDs.
