# Renames or moves a tracked file with "git mv" and stages the rename for the next commit.
# Nothing is committed. gitwhy undo puts the file back under its old name.
title: Rename or move a file
aliases: [rename file, move file, git mv]
category: files
questions:
  - {id: from, ask: "Which file?", type: files, source: tracked}
  - {id: to, ask: "New path", type: text}
steps:
  - git: [mv, "{{.from}}", "{{.to}}"]
predict: "{{.from}} becomes {{.to}}, staged for the next commit."
