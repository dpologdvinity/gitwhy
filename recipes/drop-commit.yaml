title: Remove a commit from history
aliases: [delete commit, drop commit, remove past commit, erase commit, rewrite history remove commit]
category: rewrite history
checks:
  - {if: in-progress-op, block: "Finish or abort the current operation first.", suggest: abort-operation}
questions:
  - {id: commit, ask: "Which commit to remove?", type: commit, source: HEAD}
steps:
  - when: '{{eq .commit_pushed "true"}}'
    warn: "That commit is already on the remote. Removing it rewrites shared history; you'll need to force-push."
  - git: [rebase, -i, --autostash, --rebase-merges, "{{.commit_base}}"]
    todo:
      - {action: drop, commit: "{{.commit}}"}
predict: "{{.commit}} and its changes disappear from {{.branch}}. Later commits get new IDs. Later commits that depend on it may conflict."
