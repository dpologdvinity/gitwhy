# Makes new and changed files that match a pattern go into Git LFS from now on. It sets up LFS for
# your user, adds the pattern to .gitattributes and stages that file; you still need to commit it.
# Files already committed don't change (see lfs-migrate). gitwhy undo puts .gitattributes back but
# not the user-level LFS setup.
title: Store big files with Git LFS
aliases: [lfs, large files, git lfs track, big files, binary files, lfs setup]
category: LFS
checks:
  - {if: lfs-missing, block: "Git LFS isn't installed. Install it first: https://git-lfs.com"}
questions:
  - {id: pattern, ask: "Which files? (pattern like *.psd or assets/**)", type: text}
steps:
  - git: [lfs, install]
    note: Sets up Git LFS for your user (safe to repeat).
  - git: [lfs, track, "{{.pattern}}"]
  - git: [add, .gitattributes]
predict: New and changed files matching {{.pattern}} will be stored in LFS from now on. Files already committed stay as they are (use "Move existing big files into LFS").
