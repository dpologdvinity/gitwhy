# Adds a new commit that reverses an old one, without rewriting history, so it is safe for commits
# already pushed. --no-edit keeps git's "Revert ..." message without opening an editor. git may
# stop with conflicts. gitwhy undo removes the new commit.
title: Undo a commit with a new commit (safe for pushed commits)
aliases: [revert, undo pushed commit, reverse commit, cancel commit]
category: undo
explain: Makes a new commit that reverses the old one. History is not rewritten, so it is safe on shared branches.
questions:
  - {id: commit, ask: "Which commit to reverse?", type: commit, source: HEAD}
steps:
  # A merge commit has two parents; git needs to know which side to keep. Parent 1 is the branch
  # that was merged into, which is what "undo this merge" means in nearly every case.
  - when: "{{.commit_merge}}"
    git: [revert, --no-edit, -m, "1", "{{.commit}}"]
  - when: "{{if .commit_merge}}{{else}}1{{end}}"
    git: [revert, --no-edit, "{{.commit}}"]
predict: A new commit on {{.branch}} reverses the changes of {{.commit}}. History stays as it is.
