# Copies one commit from another branch onto the current branch (cherry-pick); the original stays.
# The commit picker lists only commits on that branch that aren't already in HEAD ("HEAD..from").
# git may stop with conflicts; resolve them, then continue or abort. gitwhy undo removes the copy.
title: Copy a commit from another branch
aliases: [cherry-pick, copy commit, bring commit over, apply commit from branch]
category: branches
questions:
  - {id: from, ask: "Which branch has the commit?", type: branch, source: all}
  - {id: commit, ask: "Which commit?", type: commit, source: "HEAD..{{.from}}"}
steps:
  - git: [cherry-pick, "{{.commit}}"]
predict: A copy of {{.commit}} is added on top of {{.branch}}. The original stays on {{.from}}.
