# Lets you reorder, squash, fixup, reword or drop recent commits in one go. The "todo" question
# builds a plan; gitwhy then runs "rebase -i" and writes that plan into git's todo list itself.
# GIT_EDITOR=true accepts git's default messages instead of opening an editor; --no-update-refs
# leaves other branches that point into these commits alone. gitwhy undo puts the old history back.
title: Reorder, squash, rename or drop recent commits
aliases: [reorder commits, squash commits, combine commits, interactive rebase, rebase -i, fixup, clean up commits, move commit up, move commit down]
category: rewrite history
checks:
  - {if: no-commits, block: "There are no commits yet."}
  - {if: in-progress-op, block: "Finish or abort the current operation first.", suggest: abort-operation}
questions:
  - id: plan
    ask: Arrange your commits
    type: todo
    source: HEAD
    actions: [drop, squash, fixup, reword]
    help: "squash = merge into the commit above and combine messages; fixup = merge into the commit above, keep its message."
steps:
  - when: '{{eq .plan_pushed "true"}}'
    warn: "Some of these commits are already on the remote. Editing them rewrites shared history; you'll need to force-push."
  - git: [rebase, -i, --autostash, --no-update-refs, "{{.plan_base}}"]
    env: [GIT_EDITOR=true]
    todo:
      - {action: plan, plan: "{{.plan}}"}
predict: The selected commits are rewritten in the new order. All of them get new IDs.
