title: Add changes to an older commit
aliases: [rewrite past commit, edit old commit, amend older commit, fixup, change past commit, add file to old commit]
category: rewrite history
checks:
  - {if: in-progress-op, block: "Finish or abort the current operation first.", suggest: abort-operation}
questions:
  - {id: files, ask: "Which changed files to add to the old commit?", type: files, source: changed, multi: true}
  - {id: commit, ask: "Which commit should get them?", type: commit, source: HEAD}
steps:
  - when: '{{eq .commit_pushed "true"}}'
    warn: "That commit is already on the remote. Changing it rewrites shared history; you'll need to force-push."
  - git: [add, -A, --, "{{.files}}"]
  - git: [commit, "--fixup={{.commit}}", --, "{{.files}}"]
  - git: [rebase, -i, --autosquash, --autostash, --rebase-merges, "{{.commit_base}}"]
    env: [GIT_SEQUENCE_EDITOR=true]
predict: The chosen file changes become part of {{.commit}}. It and every later commit get new IDs.
