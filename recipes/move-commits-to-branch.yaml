title: Move my last commits to another existing branch
aliases: [move commits to branch, committed to wrong branch, transfer commits]
category: branches
checks:
  - {if: detached-head, block: "You're not on a branch."}
  - {if: dirty-tree, block: "Commit or stash your uncommitted changes first.", suggest: stash-save}
questions:
  - {id: commit, ask: "Oldest commit to move", type: commit, source: HEAD}
  - {id: target, ask: "Move them to which branch?", type: branch, source: local}
steps:
  - git: [switch, "{{.target}}"]
  - git: [cherry-pick, "{{.commit_base}}..{{.branch}}"]
  - git: [switch, "{{.branch}}"]
  - git: [reset, --keep, "{{.commit_base}}"]
predict: The commits from {{.commit}} onward are copied onto {{.target}}, then removed from {{.branch}}.
