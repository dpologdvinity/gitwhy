# Keeps only the folders you list (plus top-level files) on disk, using cone-mode sparse checkout.
# The answer is split on spaces ("split: true") so each folder is its own argument. Other folders
# leave your disk but stay in git. Snapshots save the sparse-checkout settings, so gitwhy undo can
# go back.
title: Only check out some folders (sparse checkout)
aliases: [sparse checkout, only some folders, monorepo subset, partial checkout]
category: monorepo
questions:
  - {id: dirs, ask: "Folders to keep (space-separated, e.g. apps/web libs/ui)", type: text, split: true}
steps:
  - git: [sparse-checkout, set, --cone, "{{.dirs}}"]
predict: Only {{.dirs}} (plus files at the top level) stay in your working folder. Other folders disappear from disk but stay in git. Ignored files inside removed folders are deleted.
