# Merges another branch into the current one: normally, always with a merge commit (--no-ff), only
# as a fast-forward (--ff-only), or squashed into one new commit. A squash merge stages the changes
# without committing, so a separate commit step follows with your message. --no-edit keeps git's
# merge message without opening an editor. git may stop with conflicts. gitwhy undo goes back.
title: Merge another branch into mine
aliases: [merge, merge branch, combine branches, bring in changes from branch, merge master into my branch]
category: merge & conflicts
checks:
  - {if: in-progress-op, block: "Finish or abort the current operation first.", suggest: abort-operation}
questions:
  - {id: from, ask: "Merge which branch into {{.branch}}?", type: branch, source: all}
  - id: mode
    ask: How?
    type: choice
    options:
      - {label: "Normal (fast-forward if possible)", value: ""}
      - {label: "Always make a merge commit", value: "--no-ff"}
      - {label: "Squash: one commit with all its changes", value: "--squash"}
      - {label: "Only if it's a fast-forward", value: "--ff-only"}
  - {id: message, ask: "Message for the squash commit", type: text, when: '{{eq .mode "--squash"}}'}
steps:
  - git: [merge, "{{if .mode}}{{.mode}}{{end}}", --no-edit, "{{.from}}"]
    when: '{{ne .mode "--squash"}}'
  - git: [merge, --squash, "{{.from}}"]
    when: '{{eq .mode "--squash"}}'
  - git: [commit, -m, "{{.message}}"]
    when: '{{eq .mode "--squash"}}'
predict: Changes from {{.from}} are combined into {{.branch}}. If both changed the same lines, git stops for you to resolve conflicts (gitwhy resolve).
