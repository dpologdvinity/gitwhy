# Unstages the picked files ("restore --staged"); your edits stay in the files. This is the safe
# meaning of "reset file" (see TestSafeRecipeFirst in internal/search). Staging is always
# reversible (see stage-files).
title: Unstage files
aliases: [unstage, remove from staging, undo git add, reset file]
category: files
questions:
  - {id: files, ask: "Which files?", type: files, source: staged, multi: true}
steps:
  - git: [restore, --staged, --, "{{.files}}"]
predict: The chosen files are no longer staged. Your edits stay in the files.
