# Removes a file or folder from every commit with git-filter-repo (a separate tool). --force lets it
# run in a repository that isn't a fresh clone. --refs limits it to your local branches and tags
# ({{.local_refs}}, filled in by gitwhy) and makes filter-repo skip its cleanup, so gitwhy's
# snapshot refs keep the old commits and gitwhy undo can go back. Commit IDs change and you must
# force-push.
title: Remove a file from all history (leaked secret, huge file)
aliases: [remove file from history, delete secret, purge file, filter-repo, filter-branch, bfg, remove password from git]
category: rewrite history
explain: If it's a secret, rotate it anyway; anyone who cloned already has it.
checks:
  - {if: filter-repo-missing, block: "This needs git-filter-repo. Install it: https://github.com/newren/git-filter-repo/blob/main/INSTALL.md"}
  - {if: dirty-tree, block: "Commit or stash your changes first.", suggest: stash-save}
questions:
  - {id: path, ask: "Path of the file or folder to remove", type: text}
steps:
  - git: [filter-repo, --force, --invert-paths, --path, "{{.path}}", --refs, "{{.local_refs}}"]
predict: "{{.path}} is removed from every commit on your local branches and tags. All their commit IDs change; you must force-push them. The old commits stay on your computer until git cleans up, so gitwhy undo can go back."
