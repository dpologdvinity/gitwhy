# Continues the merge, rebase, cherry-pick or revert in progress once all conflicts are resolved.
# gitwhy fills in {{.op}} from the operation it finds. Bisect can't be continued, so that case stops
# before anything runs. GIT_EDITOR=true accepts git's prepared commit message instead of opening
# an editor. gitwhy undo goes back to the state before continuing.
title: Continue after fixing conflicts
aliases: [continue, rebase --continue, merge --continue, cherry-pick --continue, keep going]
category: merge & conflicts
checks:
  - {if: "!in-progress-op", block: "Nothing is in progress."}
  - {if: has-conflicts, block: "Some files still have conflicts.", suggest: resolve-conflicts}
questions: []
steps:
  - when: '{{eq .op "bisect"}}'
    fail: "A bisect can't be continued. End it with gitwhy abort."
  - git: ["{{.op}}", --continue]
    env: [GIT_EDITOR=true]
predict: The {{.op}} continues with your resolved files.
