# Creates a new branch starting at the branch you pick (the current one by default) and switches
# to it. Uncommitted changes come along. gitwhy undo deletes the new branch and switches back.
title: Create a new branch
aliases: [new branch, create branch, start branch, checkout -b, switch -c]
category: branches
questions:
  - {id: name, ask: "Name of the new branch", type: text}
  - {id: base, ask: "Start it from", type: branch, source: all, default: "{{.branch}}"}
steps:
  - git: [switch, -c, "{{.name}}", "{{.base}}"]
predict: New branch {{.name}} starts at {{.base}} and becomes your current branch. Uncommitted changes come along.
