# Lists the files in the current commit that are stored in Git LFS. Needs the git-lfs extension.
# Read only: nothing changes, so there is nothing to undo.
title: List files stored in Git LFS
aliases: [lfs ls-files, which files are in lfs, lfs status]
category: LFS
checks:
  - {if: lfs-missing, block: "Git LFS isn't installed. Install it first: https://git-lfs.com"}
questions: []
steps:
  - git: [lfs, ls-files]
predict: Lists LFS files in the current commit. Nothing changes.
